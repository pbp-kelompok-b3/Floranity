{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/forum.css' %}">
{% endblock extra_css %}

{% block content %}
<div class="container">
    <h1>{{ page_title }}</h1>
    <div class="post-form-container">
        <form method="post"
              action="{% if is_editing_post %}
                        {% url 'forum:edit_post' form.instance.pk %}
                      {% else %}
                        {% url 'forum:create_post' %}
                      {% endif %}"
              class="post-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>    
            {% endfor %}
            <button type="submit"
                    class="button button-type-1"
                    id="create-post-button">
                {% if is_editing_post %}
                    Simpan Perubahan
                {% else %}
                    Buat Post
                {% endif %}    
            </button>
        </form>
    </div>
</div>
{% endblock content %}
