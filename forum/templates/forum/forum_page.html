{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
    <link rel="stylesheet" href="{% static 'css/forum.css' %}">
{% endblock extra_css %}

{% block content %}
<div class="forum-container">
    <div class="forum-header">
        <h1>Forum Komunitas</h1>
        <div class="action-btn">
            <a class="button button-type-1" id="create-post-button">Buat Post</a>
            <a class="button button-type-1" id="edit-post-button">Kelola Post</a>
        </div>
    </div>
    <form class="search-post">
        <input class="search-post__input" type="search" placeholder="Cari Post Berdasarkan Kata Kunci">
        <button class="button button-type-2" id="forum-search-btn" type="submit">Cari Post</button>
    </form>
    <div class="container" id="post-container"></div>
</div>
{% endblock content %}
