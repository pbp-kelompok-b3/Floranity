{% extends 'forum/forum_page_base.html' %}
{% block forum-page-content %}
<div class="forum-header">
    <h1 class="page-title">Post Saya</h1>
</div>
<form class="search-post" id="search-user-post" hx-headers="{'X-CSRFToken' : '{{ csrf_token }}'}">
    <input class="search-post__input" 
           type="search" 
           placeholder="🔍︎ Cari Post Berdasarkan Kata Kunci"
           hx-post=""
           hx-target="#post-container"
           hx-swap="outerHTML"
           hx-trigger="keyup changed delay:300ms, search">
    <select name="recent_post" class="search-post__recent">
        <option value="most_recent">Paling Terbaru</option>
        <option value="oldest">Paling Terdahulu</option>
    </select>
    <select name="most_likes" class="search-post__likes">
        <option value="most_likes">Paling Banyak Disukai</option>
        <option value="least_likes">Paling Sedikit Disukai</option>
    </select>
    <button class="button button-type-2" 
            id="forum-search-btn" 
            type="submit"
            hx-post=""
            hx-target="#post-container"
            hx-swap="outerHTML">
            Cari Post
    </button>
</form>
<div class="container" id="post-container"></div>
{% endblock forum-page-content %}
